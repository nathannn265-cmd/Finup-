<main style="font-family: Arial, sans-serif; background-color: #f8f9fa; padding: 40px 20px;">
    <div style="max-width: 600px; margin: 0 auto; background: white; padding: 40px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05);">
        <h1 style="color: #111; font-size: 28px; margin-bottom: 10px; text-align: center;">Contact Finup Support</h1>
        <p style="color: #666; text-align: center; margin-bottom: 30px;">Have questions about your delivery? We are here to help!</p>

        <form style="display: flex; flex-direction: column; gap: 15px;">
            <div>
                <label style="display: block; font-weight: bold; margin-bottom: 5px; color: #333; font-size: 14px;">Full Name</label>
                <input type="text" placeholder="Your Name" style="width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box;">
            </div>

            <div>
                <label style="display: block; font-weight: bold; margin-bottom: 5px; color: #333; font-size: 14px;">Email Address</label>
                <input type="email" placeholder="you@example.com" style="width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box;">
            </div>

            <div> <label style="display: block; font-weight: bold; margin-bottom: 5px; color: #333; font-size: 14px;">Phone Number</label>
                <input type="number" placeholder="Phone" style="width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box;"></div>

            <div>
                <label style="display: block; font-weight: bold; margin-bottom: 5px; color: #333; font-size: 14px;">Message</label>
                <textarea placeholder="How can we help you?" style="width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 6px; height: 120px; box-sizing: border-box; resize: vertical;"></textarea>
            </div>

            <!-- Submit Button (styled like your btn-primary) -->
            <button type="button" style="background-color: #007bff; color: white; border: none; padding: 14px; font-weight: bold; font-size: 16px; border-radius: 6px; cursor: pointer; margin-top: 10px; transition: background 0.2s;">
                Send Message
            </button>
        </form>
    </div>
</main>
